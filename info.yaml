# Tiny Tapeout project information
project:
  title:        "32-Bit CORDIC Processor"
  author:       "Arsh Satsangi"
  discord:      ""
  description:  "32-bit iterative Q2.30 fixed-point CORDIC processor computing sine and cosine"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? 2x2 tiles
  tiles: "2x2"

  # Top module name
  top_module:  "tt_um_cordic_processor"

  # Source files in ./src
  source_files:
    - "project.v"
    - "cordic_core.v"
    - "cordic_atan_lut.v"

pinout:
  # Inputs
  ui[0]: "angle_in[0]"
  ui[1]: "angle_in[1]"
  ui[2]: "angle_in[2]"
  ui[3]: "angle_in[3]"
  ui[4]: "angle_in[4]"
  ui[5]: "angle_in[5]"
  ui[6]: "angle_in[6]"
  ui[7]: "angle_in[7]"

  # Outputs
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Bidirectional pins
  uio[0]: "byte_sel[0]"
  uio[1]: "byte_sel[1]"
  uio[2]: "we"
  uio[3]: "start"
  uio[4]: "out_sel"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "done"

# Do not change!
yaml_version: 6
